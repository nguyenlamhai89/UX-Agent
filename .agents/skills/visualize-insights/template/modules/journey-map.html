<section id="journey" class="scroll-mt-8 mt-12 pb-12">
    <div class="mb-6">
        <h3 class="text-2xl font-semibold text-slate-800 flex items-center">
            <svg class="w-6 h-6 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
            Journey Map
        </h3>
        <p class="text-slate-500 mt-2">A high-level view of the user's experience across all stages.</p>
    </div>
    
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[1200px]">
                <thead class="bg-slate-50 border-b border-slate-200">
                    <tr>
                        <th scope="col" class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider w-48 border-r border-slate-200">Dimension</th>
                        <th scope="col" class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider min-w-[200px] border-r border-slate-200 text-center"><span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Stage 1</span><br><span class="block mt-2 font-bold text-slate-700">Awareness</span></th>
                        <th scope="col" class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider min-w-[200px] border-r border-slate-200 text-center"><span class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full">Stage 2</span><br><span class="block mt-2 font-bold text-slate-700">Consideration</span></th>
                        <th scope="col" class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider min-w-[200px] border-r border-slate-200 text-center"><span class="bg-violet-100 text-violet-800 px-3 py-1 rounded-full">Stage 3</span><br><span class="block mt-2 font-bold text-slate-700">Decision Making</span></th>
                        <th scope="col" class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider min-w-[200px] border-r border-slate-200 text-center"><span class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full">Stage 4</span><br><span class="block mt-2 font-bold text-slate-700">Usage</span></th>
                        <th scope="col" class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider min-w-[200px] text-center"><span class="bg-fuchsia-100 text-fuchsia-800 px-3 py-1 rounded-full">Stage 5</span><br><span class="block mt-2 font-bold text-slate-700">Advocacy</span></th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    {{ journey_rows }}
                </tbody>
            </table>
        </div>
    </div>
</section>
