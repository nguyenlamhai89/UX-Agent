<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Research Insights - {{ project_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        mark {
            background-color: #facc15;
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            color: #1e293b;
            font-weight: 500;
        }
    </style>
    <script>
        function toggleQuote(id) {
            const quoteEl = document.getElementById('quote-' + id);
            const iconEl = document.getElementById('icon-' + id);
            if (quoteEl.classList.contains('hidden')) {
                quoteEl.classList.remove('hidden');
                iconEl.classList.add('scale-75', 'opacity-60', 'mb-1');
                iconEl.classList.remove('text-xl');
            } else {
                quoteEl.classList.add('hidden');
                iconEl.classList.remove('scale-75', 'opacity-60', 'mb-1');
                iconEl.classList.add('text-xl');
            }
        }

        function switchTab(tab) {
            const tabSaturation = document.getElementById('tab-saturation');
            const tabTranscript = document.getElementById('tab-transcript');
            const contentSaturation = document.getElementById('content-saturation');
            const contentTranscript = document.getElementById('content-transcript');

            if (tab === 'saturation') {
                tabSaturation.className = 'px-6 py-2 rounded-lg text-sm font-medium bg-white text-blue-600 shadow transition-all focus:outline-none';
                tabTranscript.className = 'px-6 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-200 transition-all focus:outline-none';
                contentSaturation.classList.remove('hidden');
                contentTranscript.classList.add('hidden');
            } else {
                tabTranscript.className = 'px-6 py-2 rounded-lg text-sm font-medium bg-white text-blue-600 shadow transition-all focus:outline-none';
                tabSaturation.className = 'px-6 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-200 transition-all focus:outline-none';
                contentTranscript.classList.remove('hidden');
                contentSaturation.classList.add('hidden');
            }
        }
        function searchTranscript() {
            const input = document.getElementById('transcript-search');
            const clearBtn = document.getElementById('search-clear-btn');
            const filter = input.value.trim().toLowerCase();
            const tbody = document.querySelector('#content-transcript tbody');
            if (!tbody) return;
            const rows = tbody.getElementsByTagName('tr');

            if (input.value) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            let regex = null;
            if (filter !== "") {
                const escapedFilter = filter.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                regex = new RegExp(`(${escapedFilter})(?![^<]*>)`, 'gi');
            }

            for (let i = 0; i < rows.length; i++) {
                const cells = rows[i].getElementsByTagName('td');
                let rowMatch = false;
                
                for (let j = 0; j < cells.length; j++) {
                    const cell = cells[j];
                    if (!cell.hasAttribute('data-original-html')) {
                        cell.setAttribute('data-original-html', cell.innerHTML);
                    }
                    const originalHTML = cell.getAttribute('data-original-html');
                    
                    if (filter === "") {
                        cell.innerHTML = originalHTML;
                    } else {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = originalHTML;
                        if (tempDiv.textContent.toLowerCase().includes(filter)) {
                            rowMatch = true;
                            cell.innerHTML = originalHTML.replace(regex, '<mark>$1</mark>');
                        } else {
                            cell.innerHTML = originalHTML;
                        }
                    }
                }
                rows[i].style.display = (filter === "" || rowMatch) ? "" : "none";
            }
        }

        function clearSearch() {
            const input = document.getElementById('transcript-search');
            input.value = '';
            searchTranscript();
            input.focus();
        }

        function clearFullTranscriptHighlights(panel) {
            const documentEl = panel?.querySelector('[data-full-transcript-document]');
            if (!documentEl) return;

            documentEl.querySelectorAll('mark[data-full-transcript-match]').forEach((match) => {
                match.replaceWith(document.createTextNode(match.textContent || ''));
            });
            documentEl.normalize();
        }

        function searchFullTranscript(input, panelId) {
            const panel = document.getElementById(panelId);
            if (!panel || !input) return;

            const clearButton = panel.querySelector('[id^="full-transcript-clear-"]');
            const documentEl = panel.querySelector('[data-full-transcript-document]');
            if (!documentEl) return;

            clearFullTranscriptHighlights(panel);
            const query = input.value.trim().toLowerCase();
            clearButton?.classList.toggle('hidden', input.value.length === 0);
            if (!query) return;

            const walker = document.createTreeWalker(documentEl, NodeFilter.SHOW_TEXT);
            const textNodes = [];
            while (walker.nextNode()) textNodes.push(walker.currentNode);

            let firstMatch = null;
            textNodes.forEach((textNode) => {
                const originalText = textNode.nodeValue || '';
                const searchableText = originalText.toLowerCase();
                let matchIndex = searchableText.indexOf(query);
                if (matchIndex === -1) return;

                const fragment = document.createDocumentFragment();
                let cursor = 0;
                while (matchIndex !== -1) {
                    fragment.append(document.createTextNode(originalText.slice(cursor, matchIndex)));
                    const mark = document.createElement('mark');
                    mark.dataset.fullTranscriptMatch = 'true';
                    mark.textContent = originalText.slice(matchIndex, matchIndex + query.length);
                    fragment.append(mark);
                    if (!firstMatch) firstMatch = mark;
                    cursor = matchIndex + query.length;
                    matchIndex = searchableText.indexOf(query, cursor);
                }
                fragment.append(document.createTextNode(originalText.slice(cursor)));
                textNode.replaceWith(fragment);
            });

            firstMatch?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function clearFullTranscriptSearch(inputId, panelId) {
            const input = document.getElementById(inputId);
            const panel = document.getElementById(panelId);
            if (!input || !panel) return;

            input.value = '';
            clearFullTranscriptHighlights(panel);
            panel.querySelector('[id^="full-transcript-clear-"]')?.classList.add('hidden');
            input.focus();
        }

        let lastTranscriptTrigger = null;
        let transcriptDrawerCloseTimer = null;

        function openTranscriptDrawer(panelId, trigger) {
            const root = document.getElementById('full-transcript-drawer-root');
            const drawer = document.getElementById('full-transcript-drawer');
            const closeButton = document.getElementById('full-transcript-drawer-close');
            const panel = document.getElementById(panelId);
            if (!root || !drawer || !panel) return;

            window.clearTimeout(transcriptDrawerCloseTimer);
            document.querySelectorAll('[data-full-transcript-panel]').forEach((item) => {
                item.classList.toggle('hidden', item.id !== panelId);
            });

            lastTranscriptTrigger = trigger || document.activeElement;
            root.classList.remove('hidden');
            root.setAttribute('aria-hidden', 'false');
            window.requestAnimationFrame(() => {
                drawer.classList.remove('translate-x-full');
                if (closeButton) closeButton.focus();
            });
        }

        function closeTranscriptDrawer() {
            const root = document.getElementById('full-transcript-drawer-root');
            const drawer = document.getElementById('full-transcript-drawer');
            if (!root || !drawer || root.classList.contains('hidden')) return;

            drawer.classList.add('translate-x-full');
            root.setAttribute('aria-hidden', 'true');
            transcriptDrawerCloseTimer = window.setTimeout(() => {
                root.classList.add('hidden');
                if (lastTranscriptTrigger && typeof lastTranscriptTrigger.focus === 'function') {
                    lastTranscriptTrigger.focus();
                }
            }, 300);
        }

        document.addEventListener('keydown', (event) => {
            const root = document.getElementById('full-transcript-drawer-root');
            const drawer = document.getElementById('full-transcript-drawer');
            if (!root || root.classList.contains('hidden')) return;

            if (event.key === 'Escape') {
                event.preventDefault();
                closeTranscriptDrawer();
                return;
            }

            if (event.key !== 'Tab' || !drawer) return;
            const focusable = Array.from(drawer.querySelectorAll(
                'button:not([disabled]), a[href], input:not([disabled]), [tabindex]:not([tabindex="-1"])'
            ));
            if (!focusable.length) return;
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        });
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col hidden md:flex">
        <div class="p-6 border-b border-slate-200">
            <h1 class="text-xl font-bold text-blue-600 tracking-tight">{{ project_name }}</h1>
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-1 px-3">
                <li>
                    <a href="#overview" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-700 hover:text-blue-600 hover:bg-blue-50 transition-colors">
                        <svg class="w-5 h-5 mr-3 text-slate-400 group-hover:text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                        Overview
                    </a>
                </li>
                <li>
                    <a href="#insights" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-700 hover:text-blue-600 hover:bg-blue-50 transition-colors">
                        <svg class="w-5 h-5 mr-3 text-slate-400 group-hover:text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                        Insights
                    </a>
                </li>
                <li>
                    <a href="#persona" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-400 hover:text-slate-600 cursor-not-allowed">
                        <svg class="w-5 h-5 mr-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        Persona <span class="ml-auto bg-slate-100 text-slate-500 text-[10px] px-2 py-0.5 rounded-full">Soon</span>
                    </a>
                </li>
                <li>
                    <a href="#journey" class="{{ journey_nav_class }}">
                        <svg class="{{ journey_icon_class }}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                        Journey Map {{ journey_nav_badge }}
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">
            
            <!-- SECTION 1: OVERVIEW -->
            {{ overview_module }}

            <!-- SECTION COMBINED: INSIGHTS & TRANSCRIPT -->
            <section id="insights" class="scroll-mt-8">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
                    <h3 class="text-2xl font-semibold text-slate-800 flex items-center">
                        <svg class="w-6 h-6 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                        Insights
                    </h3>
                    <div class="bg-slate-100 p-1 rounded-xl inline-flex shadow-inner">
                        <button onclick="switchTab('saturation')" id="tab-saturation" class="px-6 py-2 rounded-lg text-sm font-medium bg-white text-blue-600 shadow transition-all focus:outline-none">Saturation</button>
                        <button onclick="switchTab('transcript')" id="tab-transcript" class="px-6 py-2 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-200 transition-all focus:outline-none">Transcript</button>
                    </div>
                </div>
                
                <div id="content-saturation">
                    {{ insights_saturation_module }}
                </div>

                <div id="content-transcript" class="hidden">
                    {{ transcript_module }}
                </div>
            </section>

            <!-- SECTION: JOURNEY MAP -->
            {{ journey_module }}

        </div>
    </main>
</body>
</html>
